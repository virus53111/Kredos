<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b34"><meta name="description" content="KREDOS — списки строительных материалов"><title>KREDOS · Материалы</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"></head><body>
<header class="topbar"><a class="brand" href="#"><span class="brand-mark">K</span><span>KREDOS</span></a><div class="top-actions"><button id="soundBtn" class="top-btn" aria-label="Звук">🔊</button><button id="installBtn" class="top-btn" data-i18n="install">Установить</button><select id="languageSelect" aria-label="Язык"><option value="ru">RU</option><option value="lv">LV</option><option value="uk">UA</option></select></div></header>
<main class="shell">
<section class="hero"><div><p class="eyebrow" data-i18n="workspace">ЗАКАЗ МАТЕРИАЛОВ</p><h1 data-i18n="title">Список для объекта</h1></div><div class="counter"><strong id="itemCount">0</strong><span data-i18n="positions">позиций</span></div></section>
<section class="panel"><div class="heading"><span class="step">01</span><h2 data-i18n="object">Объект</h2></div><div class="grid two"><label><span data-i18n="address">Адрес объекта</span><input id="objectAddress" data-i18n-placeholder="addressPh" placeholder="Brīvības iela 120, Rīga"></label><label><span data-i18n="listName">Название списка</span><input id="orderName" data-i18n-placeholder="listPh" placeholder="Основные материалы"></label></div></section>
<section class="panel"><div class="heading"><span class="step">02</span><h2 data-i18n="addMaterial">Добавить материал</h2></div><form id="itemForm" class="material-form"><label class="name-field"><span data-i18n="material">Название материала</span><input id="itemName" required data-i18n-placeholder="materialPh" placeholder="Например, регипс"></label><label><span data-i18n="quantity">Количество</span><input id="itemQty" required type="number" inputmode="decimal" min="0.01" step="0.01" value="1"></label><label><span data-i18n="unit">Единица</span><select id="itemUnit"><option value="pcs" data-i18n="pcs">шт.</option><option value="m2">м²</option><option value="m">м</option><option value="kg">кг</option><option value="l">л</option><option value="pack" data-i18n="pack">уп.</option></select></label><label class="code-field"><span data-i18n="code">Код товара / штрихкод</span><input id="itemCode" inputmode="numeric" autocomplete="off" placeholder="68524992"></label><div class="form-actions"><button id="addBtn" class="primary" type="submit" data-i18n="add">Добавить</button><button id="cancelEditBtn" class="secondary" type="button" data-i18n="cancel" hidden>Отмена</button></div></form></section>
<section class="panel"><div class="heading order-heading"><div><span class="step">03</span><h2 data-i18n="order">Список материалов</h2></div><button id="clearBtn" class="text-danger" data-i18n="clear">Очистить</button></div><div id="emptyState" class="empty"><b data-i18n="emptyTitle">Список пуст</b><span data-i18n="emptyText">Добавляйте материалы один за другим.</span></div><div id="itemsList" class="items" aria-live="polite"></div></section>
<section class="panel"><div class="heading"><span class="step">04</span><h2 data-i18n="templates">Шаблоны и отправка</h2></div><div class="template-row"><input id="templateName" data-i18n-placeholder="templatePh" placeholder="Название шаблона"><button id="saveTemplateBtn" class="primary" data-i18n="saveTemplate">Сохранить как шаблон</button></div><div id="templatesList" class="templates"></div><div class="actions"><button id="saveBtn" class="secondary" data-i18n="save">Сохранить список</button><button id="whatsappBtn" class="whatsapp" data-i18n="whatsapp">Отправить в WhatsApp</button><button id="printBtn" class="secondary" data-i18n="print">Печать / PDF</button></div><p id="status" class="status" role="status"></p></section>
</main><script src="./app.js"></script></body></html>
