<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173b34">
  <meta name="description" content="KREDOS — заказы строительных материалов по объектам">
  <title>KREDOS · Материалы</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="KREDOS"><span class="brand-mark">K</span><span>KREDOS</span></a>
    <label class="language"><span data-i18n="language">Язык</span><select id="languageSelect" aria-label="Язык"><option value="ru">RU</option><option value="lv">LV</option><option value="uk">UA</option></select></label>
  </header>

  <main class="shell">
    <section class="hero">
      <div><p class="eyebrow" data-i18n="workspace">Рабочий список</p><h1 data-i18n="title">Материалы для объекта</h1><p data-i18n="subtitle">Соберите заказ, сохраните его и отправьте поставщику.</p></div>
      <div class="hero-number"><span id="itemCount">0</span><small data-i18n="positions">позиций</small></div>
    </section>

    <section class="panel object-panel">
      <div class="section-heading"><div><p class="step">01</p><h2 data-i18n="object">Объект</h2></div><button id="newOrderBtn" class="quiet" data-i18n="newOrder">Новый заказ</button></div>
      <div class="grid two">
        <label><span data-i18n="objectAddress">Адрес объекта</span><input id="objectAddress" autocomplete="street-address" data-i18n-placeholder="addressPlaceholder" placeholder="Например, Brīvības iela 120, Rīga"></label>
        <label><span data-i18n="orderName">Название заказа</span><input id="orderName" data-i18n-placeholder="orderPlaceholder" placeholder="Материалы для перегородок"></label>
      </div>
    </section>

    <section class="panel">
      <div class="section-heading"><div><p class="step">02</p><h2 data-i18n="addMaterial">Добавить материал</h2></div><button id="openCatalogBtn" class="quiet" data-i18n="savedCatalog">Сохранённый каталог</button></div>
      <form id="itemForm" class="material-form">
        <label class="wide"><span data-i18n="material">Материал</span><input id="itemName" required list="materials" data-i18n-placeholder="materialPlaceholder" placeholder="Регипс, шпаклёвка, краска…"><datalist id="materials"></datalist></label>
        <label><span data-i18n="quantity">Количество</span><input id="itemQty" required type="number" inputmode="decimal" min="0.01" step="0.01" value="1"></label>
        <label><span data-i18n="unit">Единица</span><select id="itemUnit"><option value="pcs" data-i18n="pcs">шт.</option><option value="pack" data-i18n="pack">уп.</option><option value="kg">кг</option><option value="l">л</option><option value="m">м</option><option value="m2">м²</option></select></label>
        <label class="wide"><span data-i18n="depoLink">Ссылка на товар DEPO (необязательно)</span><input id="itemLink" type="url" inputmode="url" placeholder="https://online.depo.lv/..."></label>
        <label><span data-i18n="price">Цена за единицу</span><input id="itemPrice" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></label>
        <button class="primary add-button" type="submit" data-i18n="add">Добавить</button>
      </form>
    </section>

    <section class="panel order-panel">
      <div class="section-heading"><div><p class="step">03</p><h2 data-i18n="order">Заказ</h2></div><strong id="total">€0.00</strong></div>
      <div id="emptyState" class="empty"><div class="empty-icon">+</div><h3 data-i18n="emptyTitle">Список пока пуст</h3><p data-i18n="emptyText">Добавьте первый материал выше.</p></div>
      <div id="itemsList" class="items" aria-live="polite"></div>
      <div class="actions">
        <button id="saveBtn" class="primary" data-i18n="save">Сохранить на устройстве</button>
        <button id="csvBtn" class="secondary" data-i18n="downloadCsv">Скачать CSV</button>
        <button id="printBtn" class="secondary" data-i18n="printPdf">Печать / PDF</button>
        <button id="shareBtn" class="secondary" data-i18n="share">Отправить</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </section>
  </main>

  <dialog id="catalogDialog">
    <div class="dialog-head"><div><p class="step">KREDOS</p><h2 data-i18n="catalog">Сохранённый каталог</h2></div><button id="closeCatalogBtn" class="icon-btn" aria-label="Закрыть">×</button></div>
    <p data-i18n="catalogHelp">Нажмите на товар, чтобы добавить его в форму.</p>
    <div id="catalogList" class="catalog-list"></div>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
