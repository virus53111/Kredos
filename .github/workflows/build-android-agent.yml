name: Build Android Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-agent/**'
      - '.github/workflows/build-android-agent.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p android-agent :app:assembleDebug

      - name: Rename APK
        run: cp android-agent/app/build/outputs/apk/debug/app-debug.apk PhoneBridge-Agent.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-Agent
          path: PhoneBridge-Agent.apk

      - name: Publish test APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-build-${{ github.run_number }}
          name: PhoneBridge Agent build ${{ github.run_number }}
          prerelease: true
          make_latest: true
          files: PhoneBridge-Agent.apk
